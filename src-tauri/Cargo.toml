[package]
name = "organizador"
version = "1.0.0"
description = "Organizador — explorador de arquivos com foco em limpeza e otimização"
authors = ["Organizador"]
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
organizador-core = { version = "1.0.0", path = "core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-window-state = "2.4.1"

[workspace]
members = ["core"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
