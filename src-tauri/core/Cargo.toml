[package]
name = "organizador-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
blake3 = { version = "1.8.7", features = ["pure"] }
chrono = "0.4.45"
dirs = "7.0.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.36.1"
trash = "5.2.3"

[target."cfg(windows)".dependencies]
windows-sys = "0.61.2"
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
