name: Windows — testes e instalador

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo ramo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Testes + instalador NSIS
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust (estável)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos e estilo
        run: |
          npm run typecheck
          npm run lint

      - name: Testes da interface
        run: npm test

      - name: Testes do núcleo em Rust (no Windows de verdade)
        run: cargo test --manifest-path src-tauri/Cargo.toml -p organizador-core

      - name: Gerar o instalador
        run: npx tauri build --bundles nsis

      - name: Separar o instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force instaladores | Out-Null
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $f.FullName "instaladores/Organizador-Setup.exe"

      - name: Gerar o instalador off-line (com WebView2 embutido)
        run: npx tauri build --bundles nsis --config src-tauri/tauri.offline.conf.json

      - name: Separar o instalador off-line
        shell: pwsh
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $f.FullName "instaladores/Organizador-Setup-Offline.exe"
          Get-ChildItem instaladores | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Enviar os instaladores (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: Organizador-instaladores-windows
          path: instaladores/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*.exe
          generate_release_notes: true
